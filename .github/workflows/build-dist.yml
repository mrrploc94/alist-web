name: Build custom UI dist

# Build giao diện custom của fork này -> phát hành dist.tar.gz
# theo đúng format mà build.sh (FetchWebRelease) của alist backend expect.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (kèm submodule solid-router)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm (theo packageManager trong package.json)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pack dist
        run: |
          test -f dist/index.html
          tar czf dist.tar.gz dist
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Publish immutable UI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ui-${GITHUB_SHA:0:12}"
          gh release create "$TAG" dist.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ATP workspace B · $sha_short" \
            --notes "Immutable UI build from $GITHUB_SHA. Core remains independently versioned; dist.tar.gz also supports AList dist_dir." \
            --latest
