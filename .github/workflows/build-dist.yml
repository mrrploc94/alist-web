name: Build custom UI dist

# Build giao diện custom của fork này -> phát hành dist.tar.gz
# theo đúng format mà build.sh (FetchWebRelease) của alist backend expect.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (kèm submodule solid-router)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm (theo packageManager trong package.json)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pack dist
        run: |
          test -f dist/index.html
          tar czf dist.tar.gz dist
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Publish release `custom-ui`
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete custom-ui --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create custom-ui dist.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "custom-ui $sha_short" \
            --notes "UI build từ commit $sha_short ($GITHUB_SHA). Core alist sẽ tải asset này qua releases/latest/download/dist.tar.gz."
